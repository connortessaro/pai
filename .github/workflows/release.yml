name: Release

# Push a version tag to publish:
#   npm version patch   # or minor / major; updates package.json and tags vX.Y.Z
#   git push --follow-tags
#
# Publishing uses npm trusted publishing (OIDC), so there is no npm token in
# this repo, and npm attaches provenance linking the package to this run.
# The one exception is the package's very first version: npm can only attach
# a trusted publisher to a package that already exists, so that first publish
# is done once by hand, or with an NPM_TOKEN secret that is deleted afterwards.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No cache in release builds.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          cli="$(grep -oE "VERSION = '[^']+'" src/pai.mts | cut -d"'" -f2)"
          echo "tag=$tag package.json=$pkg src/pai.mts=$cli"
          test "$tag" = "$pkg" && test "$pkg" = "$cli"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Publish to npm
        env:
          # Only for the one-time first publish. Leave the secret unset after
          # that, so npm uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping."
          else
            npm publish --access public
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's section of CHANGELOG.md, up to the next heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
